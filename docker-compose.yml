services:
  server:
    build:
      context: ./server
    ports:
      - "3001:3001"
    env_file:
      - path: ./server/.env
        required: false
    environment:
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/carethread.db
    volumes:
      # Only the data directory persists; mounting /app would pin stale code across rebuilds
      - carethread_data:/app/data

  simulator:
    build:
      context: ./simulator
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  carethread_data:
